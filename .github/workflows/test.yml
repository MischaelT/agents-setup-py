name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: dry-run smoke test with the shipped manifest
        run: python -m agents_setup --dry-run
        env:
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
      - name: copy fallback (no symlinks), tests again
        run: python -m pytest -q tests/test_sync.py -k copy
        env:
          AGENTS_FORCE_COPY: "1"
